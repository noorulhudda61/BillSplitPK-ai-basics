<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillSplit PK - Smart Expense Split</title>
<style>
body{font-family:sans-serif;max-width:500px;margin:0 auto;padding:15px;background:#f5f7ff}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button{background:#4f46e5;color:white;border:none;font-weight:bold}
.member{display:inline-block;background:#eef;padding:5px 10px;border-radius:20px;margin:3px}
.payBox{background:#fff1f2;border-left:4px solid #e11d48;padding:10px;margin:5px 0;border-radius:8px}
.settled{background:#f0fdf4;color:#059669;padding:10px;border-radius:8px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<h1>BillSplit PK 🇵🇰</h1>
<p>Smart Expense Sharing for Students</p>

<div class="card">
<h2>1. Add Members</h2>
<input id="nameInput" placeholder="e.g. Ali">
<button onclick="addMember()">Add Member</button>
<div id="members"></div>
</div>

<div class="card">
<h2>2. Add Expense (PKR)</h2>
<input id="desc" placeholder="For what? e.g. Dinner, Rent">
<input id="amount" type="number" placeholder="Amount e.g. 3000">
<select id="paidBy"></select>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h2>Expenses</h2>
<div id="expenseList">No expenses yet</div>
</div>

<div class="card">
<h2>Final Settlement - Who Pays Whom</h2>
<div id="result">Add members and expenses to see result</div>
<button onclick="clearAll()" style="background:#eee;color:#333;margin-top:10px">Clear All</button>
</div>

<script>
let members=[],expenses=[];
function addMember(){
 let n=document.getElementById('nameInput').value.trim();
 if(!n)return;if(members.includes(n)){alert('Already added');return;}
 members.push(n);document.getElementById('nameInput').value='';render();
}
function render(){
 document.getElementById('members').innerHTML=members.map(m=>`<span class=member>${m}</span>`).join('');
 document.getElementById('paidBy').innerHTML=members.map(m=>`<option>${m}</option>`).join('');
 if(members.length>0) calc();
}
function addExpense(){
 let d=document.getElementById('desc').value||'Expense';
 let a=parseFloat(document.getElementById('amount').value);
 let p=document.getElementById('paidBy').value;
 if(!a||!p){alert('Add amount and who paid');return;}
 expenses.push({desc:d,amount:a,paidBy:p});
 document.getElementById('desc').value='';document.getElementById('amount').value='';
 renderExpenses();calc();
}
function renderExpenses(){
 if(expenses.length==0){document.getElementById('expenseList').innerHTML='No expenses yet';return;}
 document.getElementById('expenseList').innerHTML=expenses.map((e,i)=>`${i+1}. ${e.desc} - <b>${e.amount} PKR</b> paid by ${e.paidBy}`).join('<br>');
}
function calc(){
 if(members.length==0)return;
 let total=expenses.reduce((s,e)=>s+e.amount,0);
 let share=total/members.length;
 let paid={};members.forEach(m=>paid[m]=0);expenses.forEach(e=>paid[e.paidBy]+=e.amount);
 let balances=members.map(m=>({name:m,balance:paid[m]-share})).filter(b=>Math.abs(b.balance)>0.5);
 let html=`Total: <b>${total} PKR</b> | Each Share: <b>${share.toFixed(0)} PKR</b><br><br>`;
 if(balances.length==0&&total>0){html+=`<div class=settled>✅ All Settled - No one owes!</div>`;}
 else{
   let debtors=balances.filter(b=>b.balance<0).map(b=>({name:b.name,amount:Math.abs(b.balance)})).sort((a,b)=>b.amount-a.amount);
   let creditors=balances.filter(b=>b.balance>0).map(b=>({name:b.name,amount:b.balance})).sort((a,b)=>b.amount-a.amount);
   let i=0,j=0;
   while(i<debtors.length&&j<creditors.length){
     let pay=Math.min(debtors[i].amount,creditors[j].amount);
     html+=`<div class=payBox><b>${debtors[i].name}</b> → pays <b>${pay.toFixed(0)} PKR</b> → to <b>${creditors[j].name}</b></div>`;
     debtors[i].amount-=pay;creditors[j].amount-=pay;
     if(debtors[i].amount<1)i++;if(creditors[j].amount<1)j++;
   }
 }
 document.getElementById('result').innerHTML=html;
}
function clearAll(){if(confirm('Clear all?')){members=[];expenses=[];render();renderExpenses();document.getElementById('result').innerHTML='Add members and expenses to see result';}}
</script>
</body>
</html>
